# ============================================================
#  Yafho Wound Care — настройки контент-платформы «Кожа помнит»
#  Этот файл — источник правды для генератора (gen_platform.py)
#  и для всех, кто пишет тексты. Меняете здесь — меняется везде.
# ============================================================

platform:
  name: "Кожа помнит"
  manifesto: "Кожа помнит первое прикосновение, самый счастливый день, каждый шов и каждую перевязку. Пусть она помнит заботу."
  tagline: "Yafho Wound Care. Для каждой кожи."
  visual_device: "Одна линия: контур тела рисуется одной тонкой линией, а «память» кожи (шов, шрам, пластырь) — оранжевым акцентом."

brand:                       # из yafho.com и Yafho Catalog 2025
  orange: "#F38221"
  magenta: "#9B1B74"         # крест в логотипе
  yellow: "#FFE000"          # волна на обложке каталога
  blue: "#0B5AC2"            # плашки на карточках товаров сайта
  ink: "#2B2B2B"
  stage_gradient: "linear-gradient(160deg,#9FB0CC 0%,#C9D3E3 55%,#E4E9F1 100%)"
  font_display: "Inter Display"
  font_text: "Inter"

# ---------- Сегменты: кто пациент, что болит, какой продукт Yafho, что можно говорить ----------
segments:
  neonatology:
    label: "Неонатология"
    patient: "Недоношенные и новорождённые: датчики, катетеры, зонды фиксируют на коже каждый день"
    hook: "Её кожа — 2–3 слоя клеток. Ваша — 10–20."
    memory: "первое прикосновение"
    products: ["Silicone Nonwoven Dressing", "Silicone Wound Contact Layer"]
    proof: "У глубоко недоношенных (<30 нед.) роговой слой может состоять из 2–3 слоёв клеток против 10–20 у доношенных и взрослых; снятие клейких материалов — частая причина повреждений кожи в ОРИТН."
    proof_status: "проверить по первоисточнику перед публикацией (цитируется в неонатальных обзорах)"
    audience: ["неонатологи", "медсёстры ОРИТН", "родители недоношенных детей"]
    must_not: ["показывать реальных недоношенных детей без согласия родителей и клиники", "обещать отсутствие травм"]
  obstetrics:
    label: "Акушерство"
    patient: "Мамы после кесарева сечения: шов на животе, первые дни с малышом, затем рубец"
    hook: "Её первый шрам — от самого счастливого дня."
    memory: "самый счастливый день"
    products: ["Reco Dressing Kit (for belly)", "Silicone Scar Sheet", "Island Film Dressing"]
    proof: "Каждые ~5-е роды в мире — кесарево сечение (21%, ВОЗ / Betran et al., BMJ Global Health 2021); к 2030 г. прогноз ~29%."
    proof_status: "подтверждено"
    audience: ["мамы (самая большая и активная аудитория Instagram)", "акушеры-гинекологи", "роддома"]
    must_not: ["показывать открытые раны", "обещать «шрам исчезнет»", "утверждать снижение инфекций без данных по конкретному продукту"]
  plastic_surgery:
    label: "Пластическая хирургия"
    patient: "Пациенты после маммопластики, абдоминопластики, подтяжки лица: идеальный шов и долгие месяцы ухода за рубцом"
    hook: "Хирург отвечает за шов. Следующие полгода — за вами."
    memory: "каждый шов"
    products: ["Silicone Scar Sheet", "Reco Dressing Kit (Y-type for breast)"]
    proof: "Силиконовые пластины и гели — первая линия неинвазивной профилактики и лечения гипертрофических рубцов (Meaume et al., Management of scars: updated practical guidelines, 2014). Качество исследований ограничено."
    proof_status: "подтверждено (с оговоркой о качестве доказательств)"
    audience: ["пациенты пластических клиник", "пластические хирурги", "бьюти-аудитория"]
    must_not: ["до/после чужих пациентов без согласия", "гарантии результата"]
  dermatology:
    label: "Дерматология"
    patient: "Люди с очень хрупкой кожей: буллёзный эпидермолиз («дети-бабочки»), пемфигус, кожа после лазера и пилингов"
    hook: "Есть дети, чья кожа хрупкая, как крыло бабочки."
    memory: "каждое касание"
    products: ["Silicone Wound Contact Layer", "Silicone Nonwoven Dressing"]
    proof: "При буллёзном эпидермолизе рекомендуются нелипкие повязки на силиконовой основе; обычный пластырь повреждает кожу (Great Ormond Street Hospital; DEBRA)."
    proof_status: "подтверждено"
    occasion: "Неделя осведомлённости о БЭ — 25–31 октября"
    audience: ["дерматологи", "семьи с БЭ", "широкая аудитория (социальная тема)"]
    must_not: ["использовать болезнь как «шок-контент»", "публиковать без согласования с фондом/семьёй", "намекать на излечение"]
  geriatrics:
    label: "Гериатрия и уход"
    patient: "Пожилые и лежачие пациенты: тонкая кожа, пролежни на крестце и пятках, частые перевязки"
    hook: "Этот персик — кожа вашей бабушки."
    memory: "каждую перевязку"
    products: ["Sili-Care Border (incl. Sacrum 18×18, 23×23)", "Sili-Care No border"]
    proof: "40% пациентов с хроническими ранами называют смену повязки худшим в жизни с раной (Price et al., Int Wound J 2008)."
    proof_status: "подтверждено"
    audience: ["взрослые дети пожилых родителей", "сиделки", "гериатрические отделения"]
    must_not: ["показывать пролежни крупно", "утверждать профилактику пролежней конкретным продуктом без данных"]
  surgery:
    label: "Хирургия и стационар"
    patient: "Послеоперационные швы, катетеры, капельницы: повязку меняют снова и снова"
    hook: "Шов зажил. Кожа помнит каждую перевязку."
    memory: "каждый шов и каждую капельницу"
    products: ["Island Film Dressing", "Silicel Adhesive", "CHG I.V. and Catheter Fixation"]
    proof: "Повреждения кожи от медицинского клея (MARSI) получают ~16% взрослых пациентов ОРИТ (мета-анализ, J Wound Care 2024)."
    proof_status: "подтверждено"
    audience: ["хирурги", "медсёстры", "закупщики ЛПУ", "дистрибьюторы"]
    must_not: ["называть конкурентов"]

# ---------- Правила утверждений (комплаенс) ----------
claims:
  allowed:
    - "Описывать конструкцию продукта по каталогу (слои, формы, размеры)"
    - "Приводить проверенные цифры о проблеме со ссылкой на источник"
    - "Говорить о классе продуктов (силиконовые повязки) со ссылкой на руководства"
  forbidden:
    - "Обещать излечение, исчезновение шрама, отсутствие боли «на 100%»"
    - "Переносить данные исследований класса продуктов на конкретный бренд"
    - "Показывать реальных пациентов без письменного согласия"
    - "Публиковать открытые раны крупным планом"
  footer_medical: "Медицинское изделие. Применение — по назначению специалиста."

# ---------- Форматы ----------
formats:
  feed: {w: 1080, h: 1350}
  reels: {w: 1080, h: 1920, max_sec: 30, hook_sec: 1}
  stories: {w: 1080, h: 1920}

# ---------- Календарь: 4 недели, привязка к инфоповоду ----------
calendar:
  - {week: 1, mon: "Манифест «Кожа помнит» (Reel)", wed: "Акушерство: «Её первый шрам» (карусель)", fri: "Гериатрия: «Персиковый тест» (Reel)"}
  - {week: 2, mon: "Неонатология: «Тест на лепестке» (Reel)", wed: "Пластика: «День 1 из 180» (старт сериала)", fri: "B2B: «Одна линия — 6 отделений» (карусель)"}
  - {week: 3, mon: "Дерматология: «Тест на рисовой бумаге» (Reel)", wed: "Акушерство: #ПисьмоШраму (UGC-старт)", fri: "Хирургия: «Шов зажил» (карусель)"}
  - {week: 4, mon: "25–31 окт: неделя «детей-бабочек» — спецпроект с фондом", wed: "Пластика: «День 30 из 180»", fri: "Итоги #ПисьмоШраму + B2B-предложение"}
